[package]
name = "netbridge-clientcore"
version.workspace = true
edition.workspace = true

[dependencies]
netbridge-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow = "1"
toml = "0.8"
dirs = "5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots-no-provider", "json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "__rustls-tls"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
netbridge-server.workspace = true
tempfile = "3"
tokio = { version = "1", features = ["full"] }
