[package]
name = "netbridge-server"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "netbridge-server"
path = "src/main.rs"

[dependencies]
netbridge-scan.workspace = true
netbridge-proto.workspace = true
netbridge-pii.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
anyhow = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
futures-util = "0.3"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "__rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots-no-provider", "json", "stream"] }
tokio-util = { version = "0.7", features = ["io"] }
async-trait = "0.1"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "__rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots-no-provider", "json"] }
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
