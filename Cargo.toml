[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
netbridge-proto = { path = "crates/proto" }
netbridge-pii = { path = "crates/pii" }
netbridge-server = { path = "crates/server" }
netbridge-clientcore = { path = "crates/clientcore" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
